# Nastavenie hostingu na Netlify
# Stránka nemá build krok – súbory sa nahrávajú tak, ako sú v repozitári.

[build]
  publish = "."

# ---------------------------------------------------------------------------
# Interné súbory nezverejňovať
#
# Publish directory je koreň repozitára, takže bez týchto pravidiel by boli
# na doméne verejne čitateľné zadanie, dokumentácia, exporty z Figmy aj kód
# backendu – vrátane poznámok, ktoré do rúk návštevníkom nepatria.
#
# force = true je dôležité: bez neho by sa pravidlo neuplatnilo na súbory,
# ktoré na disku existujú (a tieto existujú).
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/design/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/google-apps-script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_input/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/MASTER_PROMPT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true


# ---------------------------------------------------------------------------
# Bezpečnostné hlavičky
#
# Content-Security-Policy tu zámerne NIE JE. GTM načítava skripty podľa toho,
# aké tagy sú v kontajneri, takže by CSP vyžadovala veľa výnimiek a pri každom
# novom tagu by sa stránka ticho rozbila. Keď bude kontajner ustálený,
# oplatí sa ju doplniť – postup je v README.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

# Fonty majú v názve pevnú verziu obsahu, takže ich môže prehliadač
# držať v cache rok.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Obrázky sa menia zriedka – týždeň je rozumný kompromis.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
