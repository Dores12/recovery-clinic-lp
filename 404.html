<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Stránka sa nenašla | Recovery Clinic Bratislava</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#142947">

  <!-- Chybová stránka zámerne neobsahuje GTM ani cookie lištu – nie je to
       vstupná stránka a nemá zmysel ju merať. -->

  <link rel="preload" href="assets/fonts/montserrat-latin-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <style>
    /* Jediná stránka, kde potrebujeme vycentrovať obsah na celú výšku okna */
    .notfound {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 40px var(--gutter);
      background: var(--grad-hero);
      text-align: center;
    }
    .notfound__inner { max-width: 560px; }
    .notfound__drop { width: 64px; margin: 0 auto 28px; }
    .notfound__code {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 64px;
      line-height: 1;
      color: var(--c-blue);
      margin-bottom: 12px;
    }
    .notfound h1 { margin-bottom: 16px; }
    .notfound p { margin-bottom: 32px; }
    .notfound__cta { display: grid; gap: 12px; }
    @media (min-width: 560px) {
      .notfound__cta { display: flex; justify-content: center; }
    }
    .notfound__contact {
      margin-top: 32px;
      font-size: var(--fs-body-s);
      color: var(--c-text-muted);
    }
    .notfound__contact a { color: var(--c-blue-dark); }
  </style>
</head>
<body>

<main class="notfound">
  <div class="notfound__inner">
    <img class="notfound__drop" src="assets/img/favicon.svg" alt="" aria-hidden="true" width="64" height="64">

    <p class="notfound__code" aria-hidden="true">404</p>
    <h1>Táto stránka sa nenašla</h1>
    <p class="body-l">
      Odkaz je zrejme starý alebo má preklep. Vráťte sa na úvod – alebo si
      rovno vyberte termín.
    </p>

    <div class="notfound__cta">
      <a class="btn btn--primary" href="/">
        Späť na úvod
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
      </a>
      <a class="btn btn--secondary"
         href="https://recoveryclinicbratislava.myapponio.com/#reservation">
        Rezervovať online
      </a>
    </div>

    <p class="notfound__contact">
      Potrebujete poradiť? Zavolajte nám na
      <a href="tel:+421948375871">+421 948 375 871</a>
      alebo napíšte na
      <a href="mailto:bratislava@recovery-clinic.sk">bratislava@recovery-clinic.sk</a>.
    </p>
  </div>
</main>

</body>
</html>
